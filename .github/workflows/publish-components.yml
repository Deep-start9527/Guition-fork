name: Publish components

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'Guition-JC/Guition'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: espressif/upload-components-ci-action@v2
        with:
          namespace: guition
          components: |
            esp_lcd_axs15260:components/lcd/esp_lcd_axs15260
            esp_lcd_touch_gsl3680:components/touch/esp_lcd_touch_gsl3680
            guition_boards:components/board/guition_boards

# Generated SD overlay: tools/guition/sd_boards.py
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 7
        scl: 8

  - name: i2s_audio_out
    type: i2s
    role: master
    format: tdm-out
    config: &id001
      port: 0
      sample_rate_hz: 44100
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: 13
        bclk: 12
        ws: 10
        dout: 9
        din: 11

  - name: i2s_audio_in
    type: i2s
    role: master
    format: tdm-in
    config: *id001

  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 20
      mode: GPIO_MODE_OUTPUT
      pull_up: true
      default_level: 0

  - name: ldo_mipi
    type: ldo
    config:
      chan_id: 3
      voltage_mv: 2500
      adjustable: 1
      owned_by_hw: 0

  - name: dsi_display
    type: dsi
    config:
      bus_id: 0
      data_lanes: 2
      phy_clk_src: 0
      lane_bit_rate_mbps: 750

  - name: ledc_backlight
    type: ledc
    version: default
    config:
      gpio_num: 23
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: 1
      timer_sel: 1
      duty: 0

  - name: uart_1
    type: uart
    config:
      uart_num: 1
      rx_buffer_size: 256
      tx_buffer_size: 256
      tx_io_num: 26
      rx_io_num: 27
      rts_io_num: -1
      cts_io_num: -1
      uart_mode: UART_MODE_UART
      use_queue: false
      queue_size: 10
      intr_alloc_flags: 0
      uart_config:
        baud_rate: 921600
        data_bits: UART_DATA_8_BITS
        parity: UART_PARITY_DISABLE
        stop_bits: UART_STOP_BITS_1
        flow_ctrl: UART_HW_FLOWCTRL_DISABLE
        rx_flow_ctrl_thresh: 0
        source_clk: UART_SCLK_DEFAULT
        lp_source_clk: null
        flags:
          allow_pd: 0
          backup_before_sleep: 0

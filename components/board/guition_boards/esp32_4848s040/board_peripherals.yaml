# Generated SD overlay: tools/guition/sd_boards.py
peripherals:
- name: ledc_backlight
  type: ledc
  config:
    gpio_num: 38
    channel: LEDC_CHANNEL_0
    timer_sel: LEDC_TIMER_0
    freq_hz: 1000
    duty_resolution: LEDC_TIMER_10_BIT
    duty: 0
    speed_mode: LEDC_LOW_SPEED_MODE
    output_invert: false
- name: i2c_touch
  type: i2c
  config:
    port: 0
    pins:
      scl: 45
      sda: 19
    enable_internal_pullup: true
- name: spi_sdcard
  type: spi
  config:
    spi_bus_config:
      spi_port: 1
      mosi_io_num: 47
      miso_io_num: 41
      sclk_io_num: 48
      quadwp_io_num: -1
      quadhd_io_num: -1
      max_transfer_sz: 4096

# Generated SD overlay: tools/guition/sd_boards.py
devices:
  - name: audio_dac
    chip: es8311
    type: audio_codec
    config:
      dac_enabled: true
      sys_cfg:
        no_mclk: true
      dac_cfg:
        ref_enable: true
    peripherals:
      - name: gpio_pa_control
        gain: 6
        pa_active_level: 1
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: audio_adc
    chip: es8311
    type: audio_codec
    config:
      adc_enabled: true
      sys_cfg:
        no_mclk: true
      adc_cfg:
        label: [FC, RE]
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: display_lcd
    chip: st7701
    type: display_lcd
    sub_type: dsi
    dependencies:
      espressif/esp_lcd_st7701: ^2.0.2
    config:
      reset_gpio_num: 5
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      bits_per_pixel: 24
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 34
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags:
          use_dma2d: true
          disable_lp: false
        video_timing:
          h_size: 480
          v_size: 800
          hsync_back_porch: 42
          hsync_pulse_width: 12
          hsync_front_porch: 42
          vsync_back_porch: 8
          vsync_pulse_width: 2
          vsync_front_porch: 166
    peripherals:
      - name: ldo_mipi
      - name: dsi_display

  - name: lcd_touch
    chip: gls3680
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
      touch_config:
        x_max: 800
        y_max: 1280
        rst_gpio_num: -1
        int_gpio_num: -1
        flags:
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0xBA, 0x28]

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_DEFAULT
        bus_width: 4
        pins:
          clk: 43
          cmd: 44
          d0: 39
          d1: 40
          d2: 41
          d3: 42
          d4: -1
          d5: -1
          d6: -1
          d7: -1
          cd: -1
          wp: -1
        ldo_chan_id: 4

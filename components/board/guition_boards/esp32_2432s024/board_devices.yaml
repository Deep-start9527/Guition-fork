# Generated SD overlay: tools/guition/sd_boards.py
devices:
  - name: display_lcd
    type: display_lcd
    version: 1.0.0
    sub_type: spi
    chip: st7789
    config:
      x_max: 240
      y_max: 320
      swap_xy: false
      mirror_x: true
      mirror_y: false
      invert_color: false
      need_reset: true
      frame_format: RGB565_BE
      io_spi_config:
        cs_gpio_num: 15
        dc_gpio_num: 2
        spi_mode: 0
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: -1
        bits_per_pixel: 16
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        flags:
          reset_active_high: false
    peripherals:
      - spi_name: spi_display

  - name: lcd_touch
    type: lcd_touch
    sub_type: i2c
    chip: cst820
    init_skip: true
    config:
      touch_config:
        x_max: 240
        y_max: 320
        rst_gpio_num: 25
        int_gpio_num: -1
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
      io_i2c_config:
        scl_speed_hz: 100000
        control_phase_bytes: 1
        dc_bit_offset: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 0
        transaction_timeout_ms: 0
        flags:
          dc_low_on_data: false
          disable_control_phase: true
    peripherals:
      - i2c_name: i2c_touch
        i2c_addr: [0x2A]
    dependencies:
      espressif/esp_lcd_touch:
        version: ==1.2.1
        public: true
      kodediy/esp_lcd_touch_cst820:
        version: ==1.0.1
        public: true
        matches:
          - if: $CONFIG{GUITION_TOUCH_CAPACITIVE} == True

  - name: lcd_touch_resistive
    type: custom
    chip: xpt2046
    init_skip: true
    config:
      bus_name: spi_display
      touch_config:
        x_max: 240
        y_max: 320
        rst_gpio_num: -1
        int_gpio_num: -1
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: true
          mirror_y: false
      io_spi_config:
        cs_gpio_num: 33
        dc_gpio_num: -1
        spi_mode: 0
        pclk_hz: 1000000
        trans_queue_depth: 3
        lcd_cmd_bits: 8
        lcd_param_bits: 8
        cs_ena_pretrans: 0
        cs_ena_posttrans: 0
        flags:
          dc_high_on_cmd: false
          dc_low_on_data: false
          dc_low_on_param: false
          octal_mode: false
          quad_mode: false
          sio_mode: false
          psram_dma_direct: false
          lsb_first: false
          cs_high_active: false
    dependencies:
      espressif/esp_lcd_touch:
        version: ==1.2.1
        public: true
      atanisoft/esp_lcd_touch_xpt2046:
        version: ==1.0.6
        public: true
        matches:
          - if: $CONFIG{GUITION_TOUCH_RESISTIVE} == True

  - name: lcd_brightness
    type: ledc_ctrl
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 5
        frequency: SDMMC_FREQ_DEFAULT
    peripherals:
      - spi_name: spi_sdcard

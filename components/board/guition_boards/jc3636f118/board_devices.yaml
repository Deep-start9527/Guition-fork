# SPDX-License-Identifier: MIT
devices:
  - name: display_lcd
    type: display_lcd
    version: 1.0.0
    sub_type: spi
    chip: st77916
    config:
      x_max: 360
      y_max: 360
      swap_xy: false
      mirror_x: false
      mirror_y: false
      invert_color: true
      need_reset: true
      frame_format: RGB565_BE
      io_spi_config:
        cs_gpio_num: 13
        dc_gpio_num: -1
        spi_mode: 0
        pclk_hz: 80000000
        trans_queue_depth: 10
        lcd_cmd_bits: 32
        lcd_param_bits: 8
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 18
        bits_per_pixel: 16
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        flags:
          reset_active_high: false
    peripherals:
      - spi_name: spi_display
    dependencies:
      espressif/esp_lcd_st77916: ==2.0.2

  - name: lcd_touch
    type: custom
    chip: guition_touch
    config: {}
    dependencies:
      espressif/esp_lcd_touch_cst816s:
        version: ==1.1.1~1
        public: true
        matches:
          - if: $CONFIG{GUITION_TOUCH_CAPACITIVE} == True

  - name: lcd_brightness
    type: ledc_ctrl
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_1
        frequency: SDMMC_FREQ_DEFAULT
        bus_width: 4
        pins:
          clk: 24
          cmd: 25
          d0: 20
          d1: 21
          d2: 22
          d3: 23
          d4: -1
          d5: -1
          d6: -1
          d7: -1
          cd: -1
          wp: -1
        ldo_chan_id: -1
